; CouchDB settings for Obsidian's Self-hosted LiveSync (the notes vault's sync hub).
; Baked into the image at /opt/couchdb/etc/local.d/ (see Dockerfile). The image's own docker.ini (admin user) sorts after
; this file, so any setting changed through the API lands there instead of here.

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
; Every request needs the login, except /_up (the health check).
require_valid_user = false
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
bind_address = 0.0.0.0

[cors]
; Obsidian on the desktop, on iOS/Android, and its local test origin.
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET,PUT,POST,HEAD,DELETE
max_age = 3600
