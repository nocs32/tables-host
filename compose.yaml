# The five tables, Cinemate and Здам, Caddy in front of them, and the Cloudflare Tunnel that brings the internet in.
# Run it with ./deploy.sh rather than by hand: it fetches the games and builds one at a time.

name: tables

x-game: &game
  restart: unless-stopped
  networks: [tables]
  # Tables live in memory: give a stopping server a moment, but no more.
  stop_grace_period: 10s

services:
  felt:
    <<: *game
    image: tables/felt
    build:
      context: ./games/felt-table-jigsaw
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: felt-table }
    # The Unsplash key. Optional: without it the Unsplash picker is off.
    env_file:
      - path: ./secrets/felt.env
        required: false

  scribble:
    <<: *game
    image: tables/scribble
    build:
      context: ./games/scribble-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: scribble-table }

  telephone:
    <<: *game
    image: tables/telephone
    build:
      context: ./games/telephone-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: telephone-table }

  wild:
    <<: *game
    image: tables/wild
    build:
      context: ./games/wild-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: wild-table }

  bluff:
    <<: *game
    image: tables/bluff
    build:
      context: ./games/bluff-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: bluff-table }

  # Not a table game, but built the same way: watch videos together (github.com/nocs32/cinemate).
  cinemate:
    <<: *game
    image: tables/cinemate
    build:
      context: ./games/cinemate
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: cinemate }
    # Only on the Pi itself: the live-share relay (media, on the host network) asks core-api here before
    # anyone publishes or watches.
    ports:
      - 127.0.0.1:2573:3000

  # Здам (github.com/nocs32/zdam): one person's driving-theory study app. Caddy serves the app; this
  # container only keeps their progress in sync between devices. Built from the repo's own Dockerfile.
  zdam:
    image: tables/zdam
    build:
      context: ./games/zdam
    restart: unless-stopped
    networks: [tables]
    # ZDAM_KEY: the personal sync key. Without it the app works, but every device keeps its own progress.
    env_file:
      - path: ./secrets/zdam.env
        required: false
    volumes:
      - zdam-data:/data

  # Cinemate's live-share relay (media/mediamtx.yml). On the host network, so it can announce the Pi's
  # own addresses to browsers; the MikroTik forwards UDP and TCP 8189 to it.
  media:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    network_mode: host
    depends_on: [cinemate]
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    # MTX_WEBRTCADDITIONALHOSTS: the home's public IP, kept out of this public repo.
    env_file:
      - path: ./secrets/media.env
        required: false

  caddy:
    image: tables/caddy
    build:
      context: ./caddy
      additional_contexts:
        felt: service:felt
        scribble: service:scribble
        telephone: service:telephone
        wild: service:wild
        bluff: service:bluff
        cinemate: service:cinemate
        zdam: service:zdam
    restart: unless-stopped
    networks: [tables]
    depends_on: [felt, scribble, telephone, wild, bluff, cinemate, zdam]
    volumes:
      - ./library:/srv/library:ro
    # Cinemate's live-share relay runs on the host network (it has to announce the Pi's own
    # addresses), so Caddy reaches it through the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Only on the Pi itself, for testing through an SSH port forward. The internet comes in
    # through the tunnel, never through this port.
    ports:
      - 127.0.0.1:8080:80

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    networks: [tables]
    depends_on: [caddy]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel.json:/etc/cloudflared/tunnel.json:ro

networks:
  tables:

volumes:
  # Здам's progress and its daily backups. Survives rebuilds; `docker compose down -v` would delete it.
  zdam-data:
