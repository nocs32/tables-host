# The five tables, Cinemate, Здам, Tunes and the notes vault's CouchDB, Caddy in front of them, and the Cloudflare Tunnel that brings the internet in.
# Run it with ./deploy.sh rather than by hand: it fetches the games and builds one at a time.

name: tables

x-game: &game
  restart: unless-stopped
  networks: [tables]
  # Tables live in memory: give a stopping server a moment, but no more.
  stop_grace_period: 10s

services:
  felt:
    <<: *game
    image: tables/felt
    build:
      context: ./games/felt-table-jigsaw
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: felt-table }
    # The Unsplash key. Optional: without it the Unsplash picker is off.
    env_file:
      - path: ./secrets/felt.env
        required: false

  scribble:
    <<: *game
    image: tables/scribble
    build:
      context: ./games/scribble-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: scribble-table }

  telephone:
    <<: *game
    image: tables/telephone
    build:
      context: ./games/telephone-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: telephone-table }

  wild:
    <<: *game
    image: tables/wild
    build:
      context: ./games/wild-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: wild-table }

  bluff:
    <<: *game
    image: tables/bluff
    build:
      context: ./games/bluff-table
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: bluff-table }

  # Not a table game, but built the same way: watch videos together (github.com/nocs32/cinemate).
  cinemate:
    <<: *game
    image: tables/cinemate
    build:
      context: ./games/cinemate
      dockerfile: ../../game.Dockerfile
      args: { SCOPE: cinemate }
    # Only on the Pi itself: the live-share relay (media, on the host network) asks core-api here before
    # anyone publishes or watches.
    ports:
      - 127.0.0.1:2573:3000

  # Здам (github.com/nocs32/zdam): one person's driving-theory study app. Caddy serves the app; this
  # container only keeps their progress in sync between devices. Built from the repo's own Dockerfile.
  zdam:
    image: tables/zdam
    build:
      context: ./games/zdam
    restart: unless-stopped
    networks: [tables]
    # ZDAM_KEY: the personal sync key. Without it the app works, but every device keeps its own progress.
    env_file:
      - path: ./secrets/zdam.env
        required: false
    volumes:
      - zdam-data:/data

  # Tunes (github.com/nocs32/tunes): a Spotify + Claude music recommender for a handful of friends.
  # Caddy serves the page; this container answers /api. Built from the repo's own Dockerfile.
  tunes:
    image: tables/tunes
    build:
      context: ./games/tunes
    restart: unless-stopped
    networks: [tables]
    # SPOTIFY_CLIENT_ID, TOKEN_KEY, ANTHROPIC_API_KEY, PUBLIC_URL (see the tunes README).
    # Without it the server stops at start and says what's missing.
    env_file:
      - path: ./secrets/tunes.env
        required: false
    volumes:
      - tunes-data:/data

  # Cinemate's live-share relay (media/mediamtx.yml). On the host network, so it can announce the Pi's
  # own addresses to browsers; the MikroTik forwards UDP and TCP 8189 to it.
  media:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    network_mode: host
    depends_on: [cinemate]
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    # MTX_WEBRTCADDITIONALHOSTS: the home's public IP, kept out of this public repo.
    env_file:
      - path: ./secrets/media.env
        required: false

  # The notes vault's sync hub: Obsidian's Self-hosted LiveSync plugin on every device syncs through
  # this CouchDB (the plugin encrypts the notes end to end). Caddy serves it at notes.timnox.dev.
  # couchdb/Dockerfile only adds the LiveSync settings. On its own: `docker compose up -d --build couchdb`.
  couchdb:
    image: tables/couchdb
    build:
      context: ./couchdb
    restart: unless-stopped
    networks: [tables]
    # COUCHDB_USER and COUCHDB_PASSWORD (the admin). Required: without an admin CouchDB won't start.
    env_file: ./secrets/couchdb.env
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The notes vault as plain files: livesync-bridge mirrors the couchdb database to ~/vault on the Pi and
  # back, so tools that aren't Obsidian (the Claude connector) can read and write notes. Needs the vault's
  # passphrase and ID key in secrets/bridge.env (made with bridge/set-secrets.sh).
  bridge:
    image: tables/bridge
    build:
      context: ./bridge
    restart: unless-stopped
    networks: [tables]
    depends_on: [couchdb]
    env_file:
      - ./secrets/couchdb.env
      - ./secrets/bridge.env
    volumes:
      - /home/admin/vault:/app/data/vault
      - bridge-state:/deno-dir/location_data

  # The notes vault for claude.ai: an MCP server (notes-mcp/) over the bridge's ~/vault, added to claude.ai
  # as a custom connector. Caddy serves it at notes-mcp.timnox.dev; it answers only with the right key.
  notes-mcp:
    image: tables/notes-mcp
    build:
      context: ./notes-mcp
    restart: unless-stopped
    networks: [tables]
    # NOTES_MCP_SECRET: the key claude.ai sends as `Authorization: Bearer <secret>`. Without it the server stops at start.
    env_file: ./secrets/notes-mcp.env
    volumes:
      - /home/admin/vault:/vault

  caddy:
    image: tables/caddy
    build:
      context: ./caddy
      # The games' finished images, not `service:` contexts: with `service:` Compose would rebuild every
      # game alongside Caddy, all at once, which runs the Pi out of memory when the build cache is cold.
      # deploy.sh builds each game first, one at a time.
      additional_contexts:
        felt: docker-image://tables/felt
        scribble: docker-image://tables/scribble
        telephone: docker-image://tables/telephone
        wild: docker-image://tables/wild
        bluff: docker-image://tables/bluff
        cinemate: docker-image://tables/cinemate
        zdam: docker-image://tables/zdam
        tunes: docker-image://tables/tunes
    restart: unless-stopped
    networks: [tables]
    depends_on: [felt, scribble, telephone, wild, bluff, cinemate, zdam, tunes]
    volumes:
      - ./library:/srv/library:ro
    # Cinemate's live-share relay runs on the host network (it has to announce the Pi's own
    # addresses), so Caddy reaches it through the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Only on the Pi itself, for testing through an SSH port forward. The internet comes in
    # through the tunnel, never through this port.
    ports:
      - 127.0.0.1:8080:80

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    networks: [tables]
    depends_on: [caddy]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel.json:/etc/cloudflared/tunnel.json:ro

networks:
  tables:

volumes:
  # Здам's progress and its daily backups. Survives rebuilds; `docker compose down -v` would delete it.
  zdam-data:
  # Tunes' SQLite file: logins (encrypted Spotify tokens), runs, votes. Same warning as above.
  tunes-data:
  # The notes vault (CouchDB's databases). Same warning; the nightly backup copies it off the Pi.
  couchdb-data:
  # The bridge's record of what it has already synced. Losing it only means a full rescan.
  bridge-state:
